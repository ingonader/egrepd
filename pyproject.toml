[project]
name = "egrepd"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ingo N.", email = "ingo.nader@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "argparse>=1.4.0",
    "ipykernel>=7.4.0",
    "odfpy>=1.4.1",
    "openpyxl>=3.1.5",
    "pip>=26.2.1",
    "pypdf>=6.20.1",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "xlrd>=2.0.2",
]

[project.scripts]
egrepd = "egrepd.egrepd:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
